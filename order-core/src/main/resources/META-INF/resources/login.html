<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Jakarta EE 11 order management sample login.">
    <meta name="theme-color" content="#1976d2">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>ログイン — Order Sample</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<main class="card">
    <div class="brand">
        <span class="brand-mark" aria-hidden="true">
            <!-- Font Awesome Free 6.7.2 — file-circle-check (CC BY 4.0) https://fontawesome.com -->
            <svg viewBox="0 0 576 512" focusable="false">
                <path fill="currentColor" d="M0 64C0 28.7 28.7 0 64 0L224 0l0 128c0 17.7 14.3 32 32 32l128 0 0 38.6C310.1 219.5 256 287.4 256 368c0 59.1 29.1 111.3 73.7 143.3c-3.2 .5-6.4 .7-9.7 .7L64 512c-35.3 0-64-28.7-64-64L0 64zm384 64l-128 0L256 0 384 128zM288 368a144 144 0 1 1 288 0 144 144 0 1 1 -288 0zm211.3-43.3c-6.2-6.2-16.4-6.2-22.6 0L416 385.4l-28.7-28.7c-6.2-6.2-16.4-6.2-22.6 0s-6.2 16.4 0 22.6l40 40c6.2 6.2 16.4 6.2 22.6 0l72-72c6.2-6.2 6.2-16.4 0-22.6z"/>
            </svg>
        </span>
        <span class="brand-name">Order Sample</span>
    </div>
    <h1>ログイン</h1>
    <p class="subtitle">注文管理画面にアクセスするには、ユーザー名とパスワードを入力してください。</p>

    <form id="login-form">
        <div class="field">
            <label for="username">ユーザー名</label>
            <input id="username" name="username" placeholder=" " autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">パスワード</label>
            <input id="password" name="password" type="password" placeholder=" " autocomplete="current-password" required>
        </div>
        <button type="submit" id="submit">ログイン</button>
    </form>

    <div class="error" id="error" role="alert" aria-live="assertive"></div>
</main>

<script src="login.js"></script>
</body>
</html>
