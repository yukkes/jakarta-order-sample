openapi: 3.0.3
info:
  title: Order Sample API
  version: 1.0.0
  description: Online order and Jakarta Batch sample API.
servers:
  - url: /api
paths:
  /orders:
    get:
      tags: [Orders]
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DRAFT, CONFIRMED, INVOICED, CANCELLED]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
    post:
      tags: [Orders]
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders/{id}/confirm:
    post:
      tags: [Orders]
      operationId: confirmOrder
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Invalid state or stock shortage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders/{id}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          description: Invalid state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /products:
    get:
      tags: [Products]
      operationId: listProducts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerResponse'
  /invoices:
    get:
      tags: [Invoices]
      operationId: listInvoices
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            example: '2026-09'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceResponse'
  /invoices/{id}:
    get:
      tags: [Invoices]
      operationId: getInvoice
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /batch/invoices:
    post:
      tags: [Batch]
      operationId: startInvoiceJob
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            example: '2026-09'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStartResponse'
  /batch/imports:
    post:
      tags: [Batch]
      operationId: startImportJob
      parameters:
        - name: inputFile
          in: query
          required: false
          schema:
            type: string
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStartResponse'
  /batch/executions:
    get:
      tags: [Batch]
      operationId: listExecutions
      parameters:
        - name: job
          in: query
          required: false
          schema:
            type: string
        - name: count
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BatchExecutionResponse'
  /batch/executions/{id}:
    get:
      tags: [Batch]
      operationId: getExecution
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchExecutionResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /batch/executions/{id}/restart:
    post:
      tags: [Batch]
      operationId: restartExecution
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStartResponse'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    CreateOrderLine:
      type: object
      required: [productCode, quantity]
      properties:
        productCode:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
    CreateOrderRequest:
      type: object
      required: [customerCode, lines]
      properties:
        customerCode:
          type: string
        orderDate:
          type: string
          format: date
          x-field-extra-annotation: >-
            @jakarta.json.bind.annotation.JsonbDateFormat("yyyy-MM-dd")
            @com.fasterxml.jackson.annotation.JsonFormat(shape = com.fasterxml.jackson.annotation.JsonFormat.Shape.STRING, pattern = "yyyy-MM-dd")
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderLine'
    OrderLineResponse:
      type: object
      properties:
        productCode:
          type: string
        productName:
          type: string
        quantity:
          type: integer
          format: int32
        unitPrice:
          type: number
        lineAmount:
          type: number
    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        orderNo:
          type: string
        customerCode:
          type: string
        customerName:
          type: string
        orderDate:
          type: string
          format: date
          x-field-extra-annotation: >-
            @jakarta.json.bind.annotation.JsonbDateFormat("yyyy-MM-dd")
            @com.fasterxml.jackson.annotation.JsonFormat(shape = com.fasterxml.jackson.annotation.JsonFormat.Shape.STRING, pattern = "yyyy-MM-dd")
        status:
          type: string
          enum: [DRAFT, CONFIRMED, INVOICED, CANCELLED]
        totalAmount:
          type: number
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineResponse'
    ProductResponse:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        unitPrice:
          type: number
        stock:
          type: integer
          format: int32
    CustomerResponse:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        email:
          type: string
    InvoiceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        invoiceNo:
          type: string
        customerCode:
          type: string
        customerName:
          type: string
        orderNo:
          type: string
        billingMonth:
          type: string
        totalAmount:
          type: number
        taxAmount:
          type: number
        createdAt:
          type: string
          format: date-time
          x-field-extra-annotation: >-
            @jakarta.json.bind.annotation.JsonbDateFormat("yyyy-MM-dd'T'HH:mm:ss")
            @com.fasterxml.jackson.annotation.JsonFormat(shape = com.fasterxml.jackson.annotation.JsonFormat.Shape.STRING, pattern = "yyyy-MM-dd'T'HH:mm:ss")
    BatchStartResponse:
      type: object
      properties:
        executionId:
          type: integer
          format: int64
        jobName:
          type: string
        status:
          type: string
    StepExecutionResponse:
      type: object
      properties:
        stepName:
          type: string
        status:
          type: string
        exitStatus:
          type: string
        readCount:
          type: integer
          format: int64
        writeCount:
          type: integer
          format: int64
        commitCount:
          type: integer
          format: int64
        rollbackCount:
          type: integer
          format: int64
        skipCount:
          type: integer
          format: int64
    BatchExecutionResponse:
      type: object
      properties:
        executionId:
          type: integer
          format: int64
        jobName:
          type: string
        status:
          type: string
        exitStatus:
          type: string
        startTime:
          type: string
          format: date-time
          x-field-extra-annotation: >-
            @jakarta.json.bind.annotation.JsonbDateFormat("yyyy-MM-dd'T'HH:mm:ss")
            @com.fasterxml.jackson.annotation.JsonFormat(shape = com.fasterxml.jackson.annotation.JsonFormat.Shape.STRING, pattern = "yyyy-MM-dd'T'HH:mm:ss")
        endTime:
          type: string
          format: date-time
          x-field-extra-annotation: >-
            @jakarta.json.bind.annotation.JsonbDateFormat("yyyy-MM-dd'T'HH:mm:ss")
            @com.fasterxml.jackson.annotation.JsonFormat(shape = com.fasterxml.jackson.annotation.JsonFormat.Shape.STRING, pattern = "yyyy-MM-dd'T'HH:mm:ss")
        steps:
          type: array
          items:
            $ref: '#/components/schemas/StepExecutionResponse'
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
