quarkus.application.name=order-sample
quarkus.http.port=8080

# PostgreSQL. Start it with: docker compose up -d
# Credentials can be overridden with the DB_USER / DB_PASSWORD / DB_URL environment variables.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:orders}
quarkus.datasource.password=${DB_PASSWORD:orders}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/orders}
# The default pool size (20) caps throughput when many requests run concurrently.
quarkus.datasource.jdbc.max-size=100

# JBeret persists job instances / executions / checkpoints in the same datasource.
quarkus.jberet.repository.type=jdbc

# Monthly invoice job: 02:00 on the 1st. The job defaults to the previous month.
quarkus.jberet.job."invoiceJob".cron=0 0 2 1 * ?

# Core modules are plain JARs, so ask Quarkus to index them for JAX-RS, CDI and JPA.
quarkus.index-dependency.order-core.group-id=com.example.order
quarkus.index-dependency.order-core.artifact-id=order-core
quarkus.index-dependency.order-domain.group-id=com.example.order
quarkus.index-dependency.order-domain.artifact-id=order-domain

quarkus.log.category."com.example.order".level=INFO

# Request body limit for the REST API.
quarkus.http.limits.max-body-size=1M

# gzip/deflate static assets and JSON. The UI ships a vendored lit-html as ES modules,
# so compression keeps the extra JavaScript at roughly 10 KB over the wire.
quarkus.http.enable-compression=true

# Security headers on every response, including the static UI. The CSP allows no
# inline script/style, so the UI keeps its JavaScript and CSS in external files.
# HSTS is left to the TLS terminator; see docs/runtimes.md.
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer

%test.quarkus.log.category."com.example.order".level=DEBUG
# Tests bind a random free port so they do not collide with other local services on 8081.
%test.quarkus.http.test-port=0
