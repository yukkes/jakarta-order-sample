<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Jakarta EE 11 order management sample with JAX-RS, CDI, JPA, Bean Validation, Jakarta Batch, and portable authentication.">
    <meta name="theme-color" content="#0369a1">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Order Sample — Jakarta EE 11</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
<a class="skip-link" href="#main">本文へスキップ</a>

<header class="app-bar">
    <div class="app-bar-inner">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <!-- Font Awesome Free 6.7.2 — file-circle-check (CC BY 4.0) https://fontawesome.com -->
                <svg viewBox="0 0 576 512" focusable="false">
                    <path fill="currentColor" d="M0 64C0 28.7 28.7 0 64 0L224 0l0 128c0 17.7 14.3 32 32 32l128 0 0 38.6C310.1 219.5 256 287.4 256 368c0 59.1 29.1 111.3 73.7 143.3c-3.2 .5-6.4 .7-9.7 .7L64 512c-35.3 0-64-28.7-64-64L0 64zm384 64l-128 0L256 0 384 128zM288 368a144 144 0 1 1 288 0 144 144 0 1 1 -288 0zm211.3-43.3c-6.2-6.2-16.4-6.2-22.6 0L416 385.4l-28.7-28.7c-6.2-6.2-16.4-6.2-22.6 0s-6.2 16.4 0 22.6l40 40c6.2 6.2 16.4 6.2 22.6 0l72-72c6.2-6.2 6.2-16.4 0-22.6z"/>
                </svg>
            </span>
            <div class="brand-text">
                <h1>Order Sample</h1>
                <p>Jakarta EE 11</p>
            </div>
        </div>
        <div class="session" aria-label="ログイン中のユーザー">
            <span class="avatar" id="user-avatar" aria-hidden="true">?</span>
            <div class="session-text">
                <span class="session-name" id="current-user"></span>
                <span class="session-role" id="current-role"></span>
            </div>
            <button class="secondary small" type="button" data-action="logout">ログアウト</button>
        </div>
    </div>
</header>

<nav class="tabs" aria-label="メインナビゲーション" role="tablist">
    <div class="tabs-inner">
        <button class="active" id="tab-orders-button" data-tab="orders" role="tab"
                aria-selected="true" aria-current="page" aria-controls="tab-orders">注文</button>
        <button id="tab-products-button" data-tab="products" role="tab"
                aria-selected="false" aria-controls="tab-products">商品</button>
        <button id="tab-invoices-button" data-tab="invoices" role="tab"
                aria-selected="false" aria-controls="tab-invoices">請求書</button>
        <button id="tab-batch-button" data-tab="batch" role="tab"
                aria-selected="false" aria-controls="tab-batch">バッチ</button>
    </div>
</nav>

<main id="main" tabindex="-1">
    <section class="tab-panel" id="tab-orders" role="tabpanel" aria-labelledby="tab-orders-button" aria-hidden="false">
        <div class="split">
            <form class="panel" id="order-form">
                <div class="panel-head">
                    <div>
                        <h2>新規注文</h2>
                        <p class="hint">確定で在庫を引き当てます。</p>
                    </div>
                </div>
                <div class="fields-2">
                    <div class="field">
                        <label for="customer">顧客</label>
                        <select id="customer" required></select>
                    </div>
                    <div class="field">
                        <label for="order-date">注文日</label>
                        <input type="date" id="order-date">
                    </div>
                </div>
                <div class="lines-head">
                    <h3>明細</h3>
                    <button type="button" class="ghost small" id="add-line">行を追加</button>
                </div>
                <div id="lines"></div>
                <button type="submit" class="block">注文を作成</button>
            </form>

            <section class="panel" aria-labelledby="orders-list-title">
                <div class="panel-head">
                    <h2 id="orders-list-title">注文一覧</h2>
                    <div class="toolbar">
                        <div class="field tool">
                            <label for="orders-status">ステータス</label>
                            <select id="orders-status" data-filter="orders.status">
                                <option value="">すべて</option>
                                <option value="DRAFT">DRAFT</option>
                                <option value="CONFIRMED">CONFIRMED</option>
                                <option value="INVOICED">INVOICED</option>
                                <option value="CANCELLED">CANCELLED</option>
                            </select>
                        </div>
                        <div class="field tool">
                            <label for="orders-sort">並び順</label>
                            <select id="orders-sort" data-filter="orders.sort">
                                <option value="id,desc">ID 降順</option>
                                <option value="id,asc">ID 昇順</option>
                                <option value="orderDate,desc">注文日 降順</option>
                                <option value="orderDate,asc">注文日 昇順</option>
                                <option value="status,asc">ステータス 昇順</option>
                                <option value="totalAmount,desc">金額 降順</option>
                            </select>
                        </div>
                        <div class="field tool">
                            <label for="orders-size">件数</label>
                            <select id="orders-size" data-filter="orders.size">
                                <option value="2">2</option>
                                <option value="5">5</option>
                                <option value="10" selected>10</option>
                                <option value="20">20</option>
                            </select>
                        </div>
                        <button type="button" class="ghost small" data-action="reload-orders">再読込</button>
                    </div>
                </div>
                <div id="orders-body"></div>
            </section>
        </div>
    </section>

    <section class="tab-panel hidden" id="tab-products" role="tabpanel" aria-labelledby="tab-products-button" aria-hidden="true">
        <section class="panel">
            <div class="panel-head">
                <h2 id="products-list-title">商品</h2>
                <div class="toolbar">
                    <div class="field tool">
                        <label for="products-sort">並び順</label>
                        <select id="products-sort" data-filter="products.sort">
                            <option value="code,asc">コード 昇順</option>
                            <option value="code,desc">コード 降順</option>
                            <option value="name,asc">商品名 昇順</option>
                            <option value="unitPrice,desc">単価 降順</option>
                            <option value="stock,desc">在庫 降順</option>
                            <option value="stock,asc">在庫 昇順</option>
                        </select>
                    </div>
                    <div class="field tool">
                        <label for="products-size">件数</label>
                        <select id="products-size" data-filter="products.size">
                            <option value="2">2</option>
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                        </select>
                    </div>
                    <button type="button" class="ghost small" data-action="reload-products">再読込</button>
                </div>
            </div>
            <div id="products-body"></div>
        </section>
    </section>

    <section class="tab-panel hidden" id="tab-invoices" role="tabpanel" aria-labelledby="tab-invoices-button" aria-hidden="true">
        <section class="panel">
            <div class="panel-head">
                <h2 id="invoices-list-title">請求書</h2>
                <div class="toolbar">
                    <div class="field tool">
                        <label for="invoice-month">対象月</label>
                        <input type="month" id="invoice-month">
                    </div>
                    <div class="field tool">
                        <label for="invoices-sort">並び順</label>
                        <select id="invoices-sort" data-filter="invoices.sort">
                            <option value="id,desc">ID 降順</option>
                            <option value="id,asc">ID 昇順</option>
                            <option value="invoiceNo,asc">請求書番号 昇順</option>
                            <option value="billingMonth,desc">対象月 降順</option>
                            <option value="totalAmount,desc">税抜金額 降順</option>
                            <option value="createdAt,desc">作成日時 降順</option>
                        </select>
                    </div>
                    <div class="field tool">
                        <label for="invoices-size">件数</label>
                        <select id="invoices-size" data-filter="invoices.size">
                            <option value="2">2</option>
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                        </select>
                    </div>
                    <button type="button" class="ghost small" data-action="reload-invoices">再読込</button>
                </div>
            </div>
            <div id="invoices-body"></div>
        </section>
    </section>

    <section class="tab-panel hidden" id="tab-batch" role="tabpanel" aria-labelledby="tab-batch-button" aria-hidden="true">
        <div class="jobs">
            <section class="panel">
                <div class="panel-head">
                    <div>
                        <h2>請求書生成</h2>
                        <p class="hint">対象月の CONFIRMED 注文から作成します。</p>
                    </div>
                </div>
                <div class="fields-inline">
                    <div class="field">
                        <label for="batch-month">対象月</label>
                        <input type="month" id="batch-month">
                    </div>
                    <button type="button" data-action="start-invoice-job">実行</button>
                </div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <div>
                        <h2>CSV 取込</h2>
                        <p class="hint">空欄ならサンプル CSV を取り込みます。</p>
                    </div>
                </div>
                <div class="fields-inline">
                    <div class="field">
                        <label for="import-file">ファイル名（任意）</label>
                        <input type="text" id="import-file" placeholder=" " autocomplete="off">
                    </div>
                    <button type="button" data-action="start-import-job">実行</button>
                </div>
            </section>
        </div>

        <section class="panel" id="execution-panel" aria-labelledby="execution-title" hidden>
            <div class="panel-head">
                <h2 id="execution-title">実行状況</h2>
            </div>
            <div id="exec-box" class="exec-box"></div>
        </section>

        <section class="panel">
            <div class="panel-head">
                <h2 id="executions-list-title">最近の実行</h2>
                <button type="button" class="ghost small" data-action="reload-executions">再読込</button>
            </div>
            <div id="executions-body"></div>
        </section>
    </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
