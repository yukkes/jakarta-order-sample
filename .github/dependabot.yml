version: 2

updates:
  # Keeps the action versions in .github/workflows/build.yml current. Dependabot only
  # rewrites the `uses:` line, so the PR has to be finished with `gh actions-lock`
  # (github/gh-actions-lock) to refresh .github/workflows/actions.lock — the `lockfile`
  # job in the workflow fails until that is done.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    groups:
      # One PR for the Jakarta/platform alignment, separate ones for the rest.
      jakarta:
        patterns:
          - 'jakarta.*'
      everything-else:
        patterns:
          - '*'
    ignore:
      # The sample targets Jakarta EE 11. A major bump of a spec API (CDI 4.1 -> 5.0,
      # JAX-RS 4.0 -> 5.0, ...) or of the umbrella API means EE 12, which none of the four
      # runtimes in docs/runtimes.md is validated against yet. Patch/minor bumps still flow.
      - dependency-name: 'jakarta.*'
        update-types:
          - version-update:semver-major
      # Pinned on purpose: the runtimes in docs/runtimes.md are validated against these.
      - dependency-name: io.quarkus.platform:quarkus-bom
      - dependency-name: io.quarkiverse.jberet:quarkus-jberet-bom
